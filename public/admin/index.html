<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Precios</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrapper">
  <h1>Admin - Precios</h1>

  <section class="tasas" aria-label="Tasas de cambio">
    <div class="tasa-item">
      <label for="tasaUsd">1 USD = ? COP</label>
      <input type="number" id="tasaUsd" step="1" min="0" value="3500">
    </div>
    <div class="tasa-item">
      <label for="tasaVes">1 VES = ? COP</label>
      <input type="number" id="tasaVes" step="any" min="0" value="4.70">
    </div>
  </section>

  <div class="toolbar">
    <input type="text" id="searchAdmin" placeholder="Buscar producto...">
    <button class="btn btn-primary" id="btnNuevo">+ Nuevo</button>
    <button class="btn btn-danger" id="btnExportar">Exportar</button>
  </div>

  <main>
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Marca</th>
          <th>Categor&iacute;a</th>
          <th class="num">COP</th>
          <th class="num">USD</th>
          <th class="num">VES</th>
          <th class="acciones-th">Acci&oacute;n</th>
        </tr>
      </thead>
      <tbody id="adminBody">
        <tr><td colspan="7" class="cargando">Cargando...</td></tr>
      </tbody>
    </table>
  </main>

  <p class="total">
    <span id="totalCount">0</span> productos
  </p>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nuevo producto</h2>
    <div class="campo">
      <label for="frmProducto">Producto</label>
      <input type="text" id="frmProducto" placeholder="Ej: Coca Cola 2 Litros">
    </div>
    <div class="campo">
      <label for="frmMarca">Marca</label>
      <input type="text" id="frmMarca" placeholder="Ej: Coca Cola">
    </div>
    <div class="campo">
      <label for="frmCategoria">Categor&iacute;a</label>
      <select id="frmCategoria">
        <option value="Cervezas y Bebidas">Cervezas y Bebidas</option>
        <option value="L&aacute;cteos y Bebidas">L&aacute;cteos y Bebidas</option>
        <option value="Chocolates y Dulces">Chocolates y Dulces</option>
        <option value="Sangr&iacute;a y Licores">Sangr&iacute;a y Licores</option>
        <option value="Refrescos y Aguas">Refrescos y Aguas</option>
        <option value="Snacks y Varios">Snacks y Varios</option>
        <option value="Otra">Otra</option>
      </select>
    </div>
    <div class="campo">
      <label for="frmPrecio">Precio (COP $)</label>
      <input type="number" id="frmPrecio" step="1" min="0" placeholder="Ej: 6000">
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
