        function buscar(raw, items) {
            var q = raw.toLowerCase().trim();
            if (!q) return items;
            var pts = [];
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var txt = (item.p + ' ' + (item.m || '') + ' ' + (item.c || '')).toLowerCase();
                var score = 0;
                if (txt === q) score = 100;
                else if (txt.indexOf(q) === 0) score = 80;
                else if (txt.indexOf(' ' + q) !== -1) score = 65;
                else if (txt.indexOf(q) !== -1) score = 40;
                if (score > 0) pts.push({ item: item, score: score });
            }
            pts.sort(function (a, b) { return b.score - a.score; });
            var result = [];
            for (var j = 0; j < pts.length; j++) result.push(pts[j].item);
            return result;
        }

        var searchBar = document.getElementById('searchBar');
        var resultsBody = document.getElementById('resultsBody');

        var tasaUsd = 3500;
        var tasaVes = 4.7;

        fetch('/api/tasas').then(function(r) { return r.json(); }).then(function(t) { tasaUsd = t.usd; tasaVes = t.ves; }).catch(function() {});

        function renderResults(lista) {
            if (!lista || lista.length === 0) {
                resultsBody.innerHTML = '<tr><td colspan="5" class="vacio">No encontrado</td></tr>';
                return;
            }
            resultsBody.innerHTML = '';
            for (var i = 0; i < lista.length; i++) {
                var item = lista[i];
                var tr = document.createElement('tr');
                var marca = item.m || '';
                var cop = item.v;
                var usd = cop / tasaUsd;
                var ves = cop / tasaVes;
                tr.innerHTML = '<td>' + item.p + '</td>'
                    + '<td><span class="marca">' + marca + '</span></td>'
                    + '<td>$' + Number(cop).toLocaleString('es-CO') + '</td>'
                    + '<td>$' + Number(usd).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>'
                    + '<td>Bs ' + Number(ves).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>';
                resultsBody.appendChild(tr);
            }
        }

        renderResults(listaPrecios);

        searchBar.addEventListener('input', function (e) {
            var v = e.target.value.trim();
            renderResults(v === '' ? listaPrecios : buscar(v, listaPrecios));
        });

        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' || e.key === 'Enter') {
                e.preventDefault();
                searchBar.value = '';
                renderResults(listaPrecios);
                searchBar.focus();
